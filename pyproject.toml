[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easymanet-desktop"
version = "0.2.4"
description = "Public local-first desktop operator console for EasyMANET."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "EasyMANET Contributors"}
]
keywords = ["openmanet", "mesh", "provisioning", "openwrt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "setuptools>=68",
    "tomli>=2; python_version < '3.11'",
    "wheel",
]

[project.scripts]
easymanet-desktop = "easymanet_desktop.server:main"

[tool.setuptools.packages.find]
where = [
    "packages/core/src",
    "apps/desktop/src",
]
include = [
    "easymanet*",
    "easymanet_desktop*",
]

[tool.setuptools.package-data]
"easymanet_desktop" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [
    "packages/core/src",
    "apps/desktop/src",
    ".",
]
